# Versioned contract registry (P0-010).
#
# Single index of every domain contract: where it's defined (domain-types +
# OpenAPI), what version it's frozen at, who owns it, and which tasks
# consume it. Exists because `packages/domain-types` and
# `services/api/openapi/openapi.yaml` can each drift independently and
# nothing previously cross-checked them against each other or against
# `tasks/registry.yaml`'s `deps`. Validated by
# `task-registry contracts validate` (wired into CI).
#
# Satisfies docs/planning/gap-backlog.md's P0 item: "Contract Registry must
# link task DSL, rules, family lifecycle, permissions and events."
#
# Versioning policy (semver-shaped, not semver-tooled):
#   - patch: doc/comment clarification, no shape change.
#   - minor: additive, backward-compatible field or enum value.
#   - major: breaking change to an already-consumed group -- requires a new
#     task (never a silent edit) and a merge-gate.md Human Architect
#     decision, per that doc's "no silent scope changes" rule.
# All FROZEN groups below have moved together so far (0.1.0 -> 0.2.0, see
# docs/planning/change-log.md 0.4/0.5) because P0-009's revalidation touched
# every entity at once. `packages/domain-types`'s exported `CONTRACT_VERSION`
# is that whole-pack version; per-group `version` fields exist here so a
# future change can bump one group without implying the others moved too.

version: 1
contract_pack_version: "0.2.0"


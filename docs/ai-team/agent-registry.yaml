## Assignment rules
- Every task has one primary executor and at least one independent reviewer.
- Every wave has one wave owner, one architecture-control reviewer and explicit gate owners for QA, security and documentation where applicable.
- Every phase has an architecture-control gate independent from task implementers and must produce a review artifact before phase exit.
- Domain leads own contracts for their domains; they do not self-approve foundational changes.
- Security engineering protects the system; Security Red Team independently attempts to break it. They are never the same primary role for the same critical change.
- Child Safety is an independent concern from general security and must gate child-facing releases.
- Performance/Scale validates cross-cutting capacity assumptions and architecture guardrails before later phases depend on them.
- Legal Counsel owns the obligation register and prepares work for external counsel; it never certifies compliance itself. Privacy Engineering turns those obligations into enforced, tested mechanisms. Neither is satisfied by documentation alone.
- AI CTO owns orchestration, not product decisions reserved for the Human Architect.
- Discovery findings are routed to the domain owner and become separate tasks when scope expands.
- New tasks created from discoveries start in BACKLOG and cannot become READY until reviewer, gate owners, dependencies, acceptance criteria and test strategy are recorded.
- Agents may use Codex, Claude Code or another approved coding runtime; role and gate are tool-agnostic.

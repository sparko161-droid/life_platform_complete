openapi: 3.1.0
info:
  title: Life Platform API
  version: 0.2.0
  description: >
    Canonical external REST contract for the Life Platform API, per
    docs/architecture/api-contracts.md. P0-005 established the reusable
    envelope/pagination/idempotency components and /health. P0-009 adds the
    Phase 1 contract pack: Family/ParentMembership/ChildProfile,
    TaskTemplate/TaskAssignment/TaskCompletion, VerificationResult,
    MediaEvidence, RewardLedgerEntry and Reward, with a representative (not
    exhaustive) set of paths -- enough for Backend/Parent Web/Child Web/QA
    to start building against a frozen shape per
    tasks/packets/P0-009-phase1-contract-pack.md. Full CRUD surfaces land
    with each entity's own P1 implementation task.

servers:
  - url: /api/v1
    description: Versioned API root. Breaking changes get a new version per
      docs/architecture/api-contracts.md ("Versioning").

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness/readiness probe.
      tags: [system]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "5XX":
          $ref: "#/components/responses/Error"

  /families:
    post:
      operationId: createFamily
      summary: Register a new family. Creates it in PENDING_INVITE status.
      tags: [family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerParentId]
              properties:
                ownerParentId:
                  type: string
              additionalProperties: false
      responses:
        "201":
          description: Family created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "5XX":
          $ref: "#/components/responses/Error"

  /families/{familyId}:
    get:
      operationId: getFamily
      summary: >-
        Fetch a family. Authorization -- "Family is the security boundary
        for child data" (docs/product/actors-and-permissions.md): callable
        only by an ACTIVE member of this family or a scoped admin.
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/FamilyIdPath"
      responses:
        "200":
          description: The family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"
        "404":
          $ref: "#/components/responses/Error"
        "5XX":
          $ref: "#/components/responses/Error"

  /families/{familyId}/children:
    post:
      operationId: addChildToFamily
      summary: >-
        Add a child profile to a family. Requires the CHILD_POLICY
        capability (docs/product/family-lifecycle.md).
      tags: [family]
      parameters:
        - $ref: "#/components/parameters/FamilyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, birthYear]
              properties:
                displayName:
                  type: string
                birthYear:
                  type: integer
              additionalProperties: false
      responses:
        "201":
          description: Child profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildProfile"
        "5XX":
          $ref: "#/components/responses/Error"

  /families/{familyId}/task-templates:
    get:
      operationId: listTaskTemplates
      summary: List task templates for a family (cursor paginated).
      tags: [task]
      parameters:
        - $ref: "#/components/parameters/FamilyIdPath"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of task templates.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TaskTemplate"
        "5XX":
          $ref: "#/components/responses/Error"
    post:
      operationId: createTaskTemplate
      summary: Create a task template.
      tags: [task]
      parameters:
        - $ref: "#/components/parameters/FamilyIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTemplate"
      responses:
        "201":
          description: Task template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-templates/{taskTemplateId}/assignments:
    post:
      operationId: assignTask
      summary: >-
        Assign a task template to a child. Emits TASK_ASSIGNED
        (docs/architecture/events.md).
      tags: [task]
      parameters:
        - name: taskTemplateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedToChildId]
              properties:
                assignedToChildId:
                  type: string
                dueAt:
                  type: string
                  format: date-time
              additionalProperties: false
      responses:
        "201":
          description: Task assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-assignments/{taskAssignmentId}:
    get:
      operationId: getTaskAssignment
      summary: Fetch a task assignment.
      tags: [task]
      parameters:
        - $ref: "#/components/parameters/TaskAssignmentIdPath"
      responses:
        "200":
          description: The task assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-assignments/{taskAssignmentId}/completions:
    post:
      operationId: submitTaskCompletion
      summary: >-
        Child submits a completion. Idempotent -- "completion submissions"
        is explicitly listed in docs/architecture/api-contracts.md's
        Idempotency rule. Emits TASK_COMPLETED, then the Verification
        Engine asynchronously produces a VerificationResult and emits
        VERIFICATION_COMPLETED.
      tags: [task, verification]
      parameters:
        - $ref: "#/components/parameters/TaskAssignmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompletion"
      responses:
        "201":
          description: Completion recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCompletion"
        "5XX":
          $ref: "#/components/responses/Error"

  /children/{childId}/reward-ledger:
    get:
      operationId: listRewardLedger
      summary: >-
        Cursor-paginated reward ledger entries for a child. There is no
        balance endpoint -- "Never store mutable balance as sole truth"
        (docs/architecture/data-architecture.md); a balance is derived by
        summing entries client- or service-side.
      tags: [reward]
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: A page of reward ledger entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RewardLedgerEntry"
        "5XX":
          $ref: "#/components/responses/Error"

  # -- Vertical slice (P1-014): docs/architecture/vertical-slice/task-to-reward.md's
  # "Required commands" -- OpenToday, StartTask, ApproveCompletion,
  # RejectCompletion, RedeemReward. SubmitProof is the existing
  # `submitTaskCompletion` above, not duplicated here -- TaskCompletion
  # already carries exactly what "proof" means (media/counter/timer/note).

  /child/today:
    get:
      operationId: getChildToday
      summary: >-
        Authoritative view for the child's «Мой день» screen (C-TODAY,
        packages/ux-contracts). docs/architecture/vertical-slice/api-and-events.md:
        "returns authoritative task cards, progress, streak and available
        actions." Scoped to the requesting child's own assignments only.
      tags: [task, vertical-slice]
      parameters:
        - name: childId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Today's task cards for one child.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildTodayView"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-assignments/{taskAssignmentId}/start:
    post:
      operationId: startTaskAssignment
      summary: >-
        Child starts an assigned task. ASSIGNED -> IN_PROGRESS
        (packages/domain-types TASK_ASSIGNMENT_TRANSITIONS). Emits
        TASK_STARTED. Idempotent: a repeat with the same key while already
        IN_PROGRESS returns the current assignment, not a conflict --
        "repeat taps must not create duplicate attempts"
        (docs/ux/core-path-contracts.md).
      tags: [task, vertical-slice]
      parameters:
        - $ref: "#/components/parameters/TaskAssignmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Assignment is now IN_PROGRESS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-assignments/{taskAssignmentId}/approve:
    post:
      operationId: approveTaskCompletion
      summary: >-
        Parent approves a submitted completion (P-APPROVALS,
        packages/ux-contracts). VERIFYING -> APPROVED. Emits TASK_APPROVED,
        then REWARD_UNLOCKED once the reward is granted. Approving an
        already-APPROVED assignment with the same idempotency key returns
        the original result and does not grant the reward a second time
        (docs/architecture/vertical-slice/task-to-reward.md's invariants).
      tags: [task, vertical-slice]
      parameters:
        - $ref: "#/components/parameters/TaskAssignmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 500
              additionalProperties: false
      responses:
        "200":
          description: Assignment is now APPROVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "5XX":
          $ref: "#/components/responses/Error"

  /task-assignments/{taskAssignmentId}/reject:
    post:
      operationId: rejectTaskCompletion
      summary: >-
        Parent returns a submission for correction (P-APPROVALS's
        «Попросить повторить»). VERIFYING -> REJECTED. Emits TASK_REJECTED;
        never emits REWARD_UNLOCKED ("Rejected proof never grants the task
        reward," task-to-reward.md's invariants). The child-facing next
        state is derived client-side via
        packages/ux-contracts's deriveUiTaskState, not asserted here.
      tags: [task, vertical-slice]
      parameters:
        - $ref: "#/components/parameters/TaskAssignmentIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: >-
                    Shown to the child as the reason to try again -- never
                    a raw internal error string
                    (docs/ux/screens/child-task-detail.md's rule).
              additionalProperties: false
      responses:
        "200":
          description: Assignment is now REJECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAssignment"
        "5XX":
          $ref: "#/components/responses/Error"

  /rewards/{rewardId}/redeem:
    post:
      operationId: redeemReward
      summary: >-
        Parent or child (per reward policy) redeems an available reward
        (P-REWARDS). AVAILABLE -> REDEEMING immediately; REDEEMED follows
        once the redemption settles. A retry with the same idempotency key
        while REDEEMING returns the in-flight result rather than starting a
        second redemption ("Reward grant cannot be duplicated by retries,"
        task-to-reward.md's invariants).
      tags: [reward, vertical-slice]
      parameters:
        - $ref: "#/components/parameters/RewardIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Redemption accepted; reward is now REDEEMING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reward"
        "5XX":
          $ref: "#/components/responses/Error"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required for reward redemption, money ledger writes, completion
        submissions and integration callbacks, per
        docs/architecture/api-contracts.md ("Idempotency"). The vertical
        slice (docs/architecture/vertical-slice/api-and-events.md: "All
        commands require actor, family scope, authorization and
        idempotency key") widens this to every task-assignment/reward
        state-changing command, not only the original list -- start,
        approve and reject carry it too. Client-generated, unique per
        logical operation; replaying the same key returns the original
        result instead of repeating the side effect.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque pagination cursor. Cursor pagination is used for social
        feeds, messages, catalogs and activity history per
        docs/architecture/api-contracts.md ("Pagination"); offset pagination
        is not used for these.
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FamilyIdPath:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskAssignmentIdPath:
      name: taskAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RewardIdPath:
      name: rewardId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # Stable error envelope. Never expose database errors or
    # provider-specific details, per docs/architecture/api-contracts.md
    # ("Response rules").
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code, e.g. "NOT_FOUND".
            message:
              type: string
              description: Human-readable, safe to display; never a raw
                driver/provider error string.
            details:
              type: object
              additionalProperties: true
              description: Optional structured context. Never PII, never a
                stack trace, never a provider payload.
            correlation_id:
              type: string
              description: Matches the request's correlation id, per
                docs/engineering/observability.md ("Correlation").

    # Reusable cursor-paginated list wrapper. Concrete list responses
    # compose this with an `items` schema of their own type.
    CursorPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items: {}
        page_info:
          type: object
          required: [has_next_page]
          properties:
            has_next_page:
              type: boolean
            next_cursor:
              type: string
              nullable: true

    # ---- Phase 1 contract pack (P0-009) ----
    # Mirrors packages/domain-types' zod schemas 1:1. Keep them in sync by
    # hand for now; a schema-diff check is a good P0-012 candidate.

    ParentCapability:
      type: string
      enum: [CHILD_POLICY, MONEY_REWARDS, SOCIAL_PERMISSIONS, CHAT_VISIBILITY, ACCOUNT_DELETION]

    ParentMembership:
      type: object
      required: [parentId, familyId, status, isFamilyOwner, capabilities, invitedAt]
      properties:
        parentId:
          type: string
        familyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [INVITED, ACTIVE, REVOKED]
        isFamilyOwner:
          type: boolean
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ParentCapability"
        invitedAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time

    ChildProfile:
      type: object
      required: [childId, familyId, displayName, birthYear]
      properties:
        childId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        displayName:
          type: string
        birthYear:
          type: integer
        avatarId:
          type: string

    Family:
      type: object
      required: [familyId, status, version, createdAt, parents, children]
      properties:
        familyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_INVITE, ACTIVE, SUSPENDED, ARCHIVED]
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-concurrency token per
            docs/architecture/concurrency-and-conflicts.md. Submit the
            version you read; a stale version is rejected with an
            explicit conflict, never silently overwritten.
        createdAt:
          type: string
          format: date-time
        parents:
          type: array
          items:
            $ref: "#/components/schemas/ParentMembership"
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildProfile"

    VerificationStrategy:
      type: string
      enum:
        [
          MANUAL_SELF,
          PARENT_APPROVAL,
          PHOTO_PROOF,
          VIDEO_PROOF,
          CAMERA_EXERCISE,
          TIMER,
          COUNTER,
          AUDIO_PROOF,
          ALICE_SESSION,
          COMPOSITE,
        ]

    TaskTemplate:
      type: object
      required:
        [taskTemplateId, familyId, createdByParentId, title, verificationStrategy, rewardXp, rewardCoins, status, version, createdAt]
      properties:
        taskTemplateId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        createdByParentId:
          type: string
        title:
          type: string
        verificationStrategy:
          $ref: "#/components/schemas/VerificationStrategy"
        rewardXp:
          type: integer
          minimum: 0
        rewardCoins:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
          description: >-
            Replaces the earlier `isActive` boolean (contract 0.2.0) --
            docs/architecture/entity-lifecycle.md's default
            `DRAFT → ACTIVE → ARCHIVED → DELETED` pattern needs more than
            two states.
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    TaskAssignment:
      type: object
      required: [taskAssignmentId, taskTemplateId, familyId, assignedToChildId, status, version, assignedAt]
      properties:
        taskAssignmentId:
          type: string
          format: uuid
        taskTemplateId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        assignedToChildId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ASSIGNED, IN_PROGRESS, SUBMITTED, VERIFYING, APPROVED, REJECTED, COMPLETED, ARCHIVED]
          description: >-
            Canonical tail per docs/architecture/entity-lifecycle.md's
            "## Task" section (contract 0.2.0 -- VERIFYING/COMPLETED/
            ARCHIVED are new since 0.1.0).
        version:
          type: integer
          minimum: 1
        assignedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time

    TaskCompletion:
      type: object
      required: [taskCompletionId, taskAssignmentId, childId, submittedAt]
      properties:
        taskCompletionId:
          type: string
          format: uuid
        taskAssignmentId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        mediaEvidenceId:
          type: string
          format: uuid
        counterValue:
          type: integer
          minimum: 0
        timerSeconds:
          type: integer
          minimum: 0
        selfReportNote:
          type: string
          maxLength: 500

    ChildTodayView:
      type: object
      required: [childId, assignments, generatedAt]
      description: >-
        GET /child/today's response (P1-014, vertical slice). An
        aggregate read model, not a stored entity -- built from current
        TaskAssignment rows for the child, per
        docs/architecture/vertical-slice/api-and-events.md ("returns
        authoritative task cards, progress, streak and available
        actions"). `streak` is optional because streak calculation is
        Progression's territory (docs/game/progression.md), not yet
        implemented by this task -- disclosed here rather than a fabricated
        default.
      properties:
        childId:
          type: string
          format: uuid
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/TaskAssignment"
        streak:
          type: integer
          minimum: 0
        generatedAt:
          type: string
          format: date-time

    VerificationResult:
      type: object
      required: [taskAssignmentId, childId, strategy, outcome, verifiedAt]
      properties:
        taskAssignmentId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        strategy:
          $ref: "#/components/schemas/VerificationStrategy"
        outcome:
          type: string
          enum: [PASSED, FAILED, PENDING_REVIEW]
        mediaEvidenceId:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        reviewedByParentId:
          type: string
        notes:
          type: string
          maxLength: 500

    MediaEvidence:
      type: object
      required: [mediaEvidenceId, familyId, childId, kind, storageKey, contentType, sizeBytes, uploadedAt]
      properties:
        mediaEvidenceId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [PHOTO, VIDEO, AUDIO]
        storageKey:
          type: string
          description: >-
            Opaque S3-compatible storage key. Never a public URL -- access
            is via a short-lived signed URL minted server-side.
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        uploadedAt:
          type: string
          format: date-time
        retentionExpiresAt:
          type: string
          format: date-time

    RewardLedgerEntry:
      type: object
      required: [rewardLedgerEntryId, familyId, childId, kind, amount, reason, idempotencyKey, postedAt]
      properties:
        rewardLedgerEntryId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [XP, COINS, MONEY]
        amount:
          type: integer
          description: >-
            Signed -- positive for grants, negative for
            redemptions/deductions. No balance field anywhere -- balances
            are always derived by summing entries, never stored mutably.
        reason:
          type: string
          enum: [TASK_COMPLETION, PARENT_ADJUSTMENT, REWARD_REDEMPTION, STREAK_BONUS]
        sourceTaskAssignmentId:
          type: string
          format: uuid
        sourceRewardId:
          type: string
          format: uuid
          description: >-
            Added in contract 0.2.0: links a REWARD_REDEMPTION entry back
            to the catalog Reward it redeemed (docs/game/rewards.md
            "Coupon redemption is auditable").
        adjustedByParentId:
          type: string
        idempotencyKey:
          type: string
        postedAt:
          type: string
          format: date-time

    RewardType:
      type: string
      enum: [XP, COINS, MONEY, SCREEN_TIME, DEVICE_TIME, COUPON, ACTIVITY, FAMILY, CUSTOM]

    Reward:
      type: object
      required: [rewardId, familyId, createdByParentId, title, type, status, version, createdAt]
      description: >-
        Added in contract 0.2.0 (P0-009 revalidation) -- docs/game/rewards.md
        landed after 0.1.0: "Reward is a typed entitlement, separate from
        task completion and economy." Distinct from RewardLedgerEntry,
        which only records a currency movement.
      properties:
        rewardId:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid

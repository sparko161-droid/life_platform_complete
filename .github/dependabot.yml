version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group routine patch/minor bumps into one PR per week instead of
      # one-per-package noise; security updates for anything still get
      # their own PR regardless of this grouping (Dependabot's default
      # behavior for security advisories overrides grouping).
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.14.0"

jobs:
  checks:
    name: install-lint-typecheck-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # docs/engineering/ci-cd.md: "Pin lockfiles."
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build before typecheck/test, not after: several packages (starting
      # with packages/ux-contracts importing packages/domain-types)
      # resolve a sibling workspace package through its package.json
      # "exports" -> "./dist/...", which only exists once that package has
      # been built. tsc and tsx's Node ESM resolver both read "exports" the
      # same way at typecheck/test time, so either step running before
      # `build` fails with "Cannot find module" for any cross-package
      # import -- reproduced for real on this exact CI run (P1-014's
      # merge), masked locally only because a stale dist/ from an earlier
      # manual build was still on disk.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # docs/architecture/api-contracts.md ("Generation pipeline"):
      # fails if services/api/openapi/openapi.yaml changed without
      # regenerating and committing packages/api-client/src/generated.
      - name: OpenAPI client is up to date
        run: pnpm --filter @life/api-client run generate:check

      # docs/architecture/contract-registry.md / P0-010: fails if
      # contracts/registry.yaml drifts from packages/domain-types' real
      # exports, tasks/registry.yaml's task ids, or change-log.md headings.
      - name: Contract registry is in sync
        run: pnpm run contracts:validate

      # docs/implementations/phase-0-ai-orchestration.md's sibling doc,
      # P0-012: fails if docs/DOCS_GRAPH.md drifts from the real docs/ tree,
      # or any doc/task file references a task id that doesn't exist.
      - name: Docs graph and task references are in sync
        run: pnpm run docs:check

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # Dependabot-triggered runs get a read-only GITHUB_TOKEN with no
    # pull-requests scope by default. Without this, gitleaks-action's own
    # `pulls.listCommits` call to scope the PR diff 403s with "Resource not
    # accessible by integration" on every single Dependabot PR -- now a
    # required check (docs/engineering/branch-protection.md), so that 403
    # silently blocked every dependency-update PR from ever merging.
    # Reproduced on all 14 open Dependabot PRs before adding this.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    # Supply-chain scan per docs/engineering/ci-cd.md. Non-blocking for now:
    # the workspace has almost no real dependencies yet, so this job is
    # informational until Phase 1 introduces the real dependency surface.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  direct-push-alarm:
    name: no direct pushes to main
    runs-on: ubuntu-latest
    # Fires only on push events to main. GitHub's own branch protection is
    # unavailable on this repo's current plan (private repo, personal Free
    # account -- see docs/engineering/branch-protection.md), so there is no
    # way to *prevent* a direct push server-side today. This job detects one
    # after the fact and fails loudly, which surfaces it in the Actions tab
    # and in the owner's failure email. It is an alarm, not a lock.
    #
    # Delete this job once real branch protection is enabled -- the lock makes
    # the alarm redundant.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Assert the pushed commit is a PR merge
        run: |
          sha="${{ github.sha }}"
          parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
          # A squash-merge from a PR has 1 parent, same as a direct push, so
          # parent count alone cannot distinguish them. GitHub sets these two
          # only for merges it performed itself.
          msg=$(git log -1 --pretty=%s "$sha")
          echo "commit: $sha"
          echo "subject: $msg"
          echo "parents (incl. self): $parents"
          if [ "$parents" -ge 3 ]; then
            echo "::notice::Merge commit -- came through a PR."
            exit 0
          fi
          if echo "$msg" | grep -qE '\(#[0-9]+\)$'; then
            echo "::notice::Squash-merge from PR $(echo "$msg" | grep -oE '#[0-9]+$') -- fine."
            exit 0
          fi
          echo "::error::Commit $sha landed on main without a PR reference." \
            "AGENTS.md forbids merging directly into main. If this was" \
            "intentional (e.g. applying branch protection), note it in the" \
            "commit message; otherwise revert and reland via a PR."
          exit 1

  quality-gate-baseline:
    name: knip (dead code / unused exports)
    runs-on: ubuntu-latest
    # docs/ai-team/gates.md "Quality Gate: Checks duplicates, dead code,
    # complexity, naming and dependency direction" -- baseline automation
    # for the dead-code/unused-export slice of that. Non-blocking for now:
    # this is a young, fast-moving codebase where "unused today" often
    # means "not wired up yet", not "should be deleted" -- knip.json
    # documents the deliberate exclusions (migration files scanned by
    # node-pg-migrate's own convention, not imported; @sentry/node as a
    # disclosed optional peer dependency). Promote to blocking once the
    # baseline finding count is something a reviewer actually triages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality:dead-code

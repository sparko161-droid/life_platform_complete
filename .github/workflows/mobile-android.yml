name: Mobile Android build

# Phase-0-checklist "Android internal build path created". This is an
# unsigned debug APK for internal verification (CI artifact), not a Play
# Store release -- signing keys/Play Console access are a human decision
# (docs/security/secrets-policy.md doesn't cover mobile signing yet;
# treat that as its own follow-up once the accounts exist).
#
# NOT run automatically on every push (apps/mobile has no product code
# yet, per docs/engineering/repo-status.md); trigger manually or once
# real mobile work lands, then switch `on:` to path-filtered push/PR.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: life-mobile-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

    deps_implementation: [P1-001]
    acceptance: "Append-only reward ledger, deterministic reward calculation, exactly-once source reward identity and audit trail."
    test_strategy: "Ledger invariants, duplicate-write, replay and reward calculation tests."

  P1-007:

    priority: P1
    wave: W3
    primary: frontend-lead
    reviewer: backend-lead
    gate_owners: [qa-lead, security-child-safety]
    participants: [frontend-lead, backend-lead, uiux-lead, journey-agent, qa-lead, security-child-safety]

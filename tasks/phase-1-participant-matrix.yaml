version: 2
phase: 1
status: ACTIVE
source_of_truth: docs/planning/phase-1-execution-plan.md
outcome_contract: docs/planning/phase-1-outcome-contract.md

roles:
  ai-cto: "Delivery governance, orchestration, dependency policy, phase synthesis"
  chief-architect: "Architecture, contracts, integration boundaries, ADRs"
  architecture-control-lead: "Independent wave/phase architecture integrity and drift control"
  backend-lead: "Domain/application services, persistence, API runtime, events"
  frontend-lead: "Web UI, API client, recovery states"
  game-engine-lead: "Reward/economy domain and ledger rules"
  uiux-lead: "Screen model, UX contracts, localization"
  child-experience-lead: "Age-appropriate child UX and safety"
  qa-lead: "Acceptance, automated QA, release gate"
  journey-agent: "Real user journey and interaction traceability"
  security-engineering: "Secure architecture, authorization and defensive controls"
  child-safety-lead: "Consent, child safety and harm-prevention controls"
  security-red-team: "Independent adversarial security testing and exploit retest"
  performance-scale-agent: "Performance, indexing, concurrency and scale guardrails"
  documentation-agent: "Documentation graph, traceability and evidence package"
  code-quality-agent: "Duplication, layering and maintainability control"
  devops-lead: "CI/CD, observability, migrations and release plumbing"

rules:
  ready_requires:
    - primary
    - reviewer
    - gate_owners
    - acceptance_criteria
    - test_strategy
    - dependency_classification
    - phase
    - wave
    - priority
    - source_reference
  reviewer_must_be_independent_from_primary: true
  gate_owner_is_not_automatically_the_reviewer: true
  architecture_changes_require_chief_architect_review: true
  architecture_control_required_at_wave_exit: true
  phase_exit_requires_qa_security_red_team_scale_architecture_and_documentation_evidence: true
  new_tasks_start_in: BACKLOG
  blocking_discovery_prevents_ready: true
  unresolved_human_decision_prevents_ready: true
  contract_dependency_may_be_frozen_without_implementation_done: true
  implementation_dependency_must_be_done_for_integration: true

waves:
  W0: "Governance, contracts and admission control"
  W1: "Identity, Family and persistence foundation"
  W2: "Task and Rules runtime"
  W3: "Evidence, Verification and Idempotency"
  W4: "Reward and Event Foundation"
  W5: "Evolution, Versioning and Scale Guardrails"
  W6: "Parent and Child Core UX"
  W7: "First End-to-End Vertical Slice"
  W8: "Cross-System Validation and Phase Exit"

tasks:
  P1-001:
    title: "Family lifecycle and second-parent invitation"
    priority: P1
    wave: W1
    primary: backend-lead
    reviewer: chief-architect
    gate_owners: [qa-lead, security-engineering, child-safety-lead]
    participants: [ai-cto, backend-lead, chief-architect, security-engineering, child-safety-lead, qa-lead, documentation-agent]
    deps_contract: [P0-009, P0-010]
    deps_implementation: []
    acceptance: "Create family, add child, invite/accept second parent, enforce membership and authorization, persist lifecycle and audit evidence."
    test_strategy: "Domain, integration, negative authorization and family-isolation tests."

  P1-002A:
    title: "Task template and lifecycle core"
    priority: P1
    wave: W2
    primary: backend-lead
    reviewer: chief-architect
    gate_owners: [qa-lead, security-engineering]
    participants: [ai-cto, backend-lead, chief-architect, qa-lead, security-engineering, documentation-agent]
    deps_contract: [P0-009, P0-010]
    deps_implementation: [P1-001]
    acceptance: "Create/update/publish task template, assign child and enforce lifecycle transitions."
    test_strategy: "State-machine unit tests, integration tests and unauthorized mutation tests."

  P1-002B:
    title: "Rules DSL, scheduling and composite task model"
    priority: P1
    wave: W2
    primary: backend-lead
    reviewer: chief-architect
    gate_owners: [qa-lead, child-safety-lead]
    participants: [ai-cto, backend-lead, chief-architect, child-experience-lead, child-safety-lead, qa-lead]
    deps_contract: [P0-009, P0-010]
    deps_implementation: [P1-002A]
    acceptance: "Validate rules deterministically, support required schedule/recurrence/composite semantics and reject invalid rules."
    test_strategy: "Property/table-driven rule tests and invalid-rule regression fixtures."

  P1-003:
    title: "Parent task builder UX"
    priority: P1
    wave: W6
    primary: frontend-lead
    reviewer: uiux-lead
    gate_owners: [qa-lead, child-experience-lead]
    participants: [frontend-lead, uiux-lead, backend-lead, journey-agent, qa-lead, child-experience-lead]
    deps_contract: [P1-013]
    deps_implementation: [P1-002A, P1-002B]
    acceptance: "Parent can create/edit/publish a task through the UI with validation and recovery states."
    test_strategy: "Component, interaction and journey tests."

  P1-004:
    title: "Child today/tasks UX"
    priority: P1
    wave: W6
    primary: frontend-lead
    reviewer: uiux-lead
    gate_owners: [qa-lead, child-experience-lead, child-safety-lead]
    participants: [frontend-lead, uiux-lead, child-experience-lead, child-safety-lead, journey-agent, qa-lead]
    deps_contract: [P1-013]
    deps_implementation: [P1-002A, P1-002B]
    acceptance: "Child sees assigned tasks, opens a task, starts an attempt and sees deterministic state/recovery feedback."
    test_strategy: "Journey tests, accessibility checks and negative/recovery states."

  P1-005:
    title: "Media evidence storage and upload policy"
    priority: P1
    wave: W3
    primary: backend-lead
    reviewer: security-engineering
    gate_owners: [qa-lead, child-safety-lead, performance-scale-agent]
    participants: [backend-lead, security-engineering, child-safety-lead, qa-lead, frontend-lead, devops-lead, performance-scale-agent]
    deps_contract: [P0-002, P0-009]
    deps_implementation: [P1-001]
    acceptance: "Store/retrieve permitted evidence, enforce family isolation, retention/classification and safe upload limits."
    test_strategy: "Upload-limit, access-control, retention and storage integration tests."

  P1-006:
    title: "Reward ledger and configurable N-day rewards"
    priority: P1
    wave: W4
    primary: game-engine-lead
    reviewer: backend-lead
    gate_owners: [qa-lead, security-engineering]
    participants: [game-engine-lead, backend-lead, chief-architect, qa-lead, security-engineering]

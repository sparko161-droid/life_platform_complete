    wave: W4
    primary: qa-lead
    reviewer: security-child-safety
    gate_owners: [chief-architect, journey-agent, documentation-agent, ai-cto]
    participants: [qa-lead, security-child-safety, chief-architect, journey-agent, documentation-agent, ai-cto, devops-lead]

    wave: W0
    primary: uiux-lead
    reviewer: chief-architect
    gate_owners: [frontend-lead, backend-lead, qa-lead]
    participants: [uiux-lead, chief-architect, frontend-lead, backend-lead, qa-lead, documentation-agent]

version: 3
phase: 1
status: BLOCKED

blockers:
  - id: BLK-P1-001
    priority: P0
    status: RESOLVED
    title: "Reconcile duplicate screen ID systems"
    source: DISC-P1-009-1
    owners: [uiux-lead, chief-architect]
    reviewers: [frontend-lead, backend-lead, qa-lead]
    blocks: []
    resolution: "Select one canonical screen-ID system and update UX docs, contracts, tests and traceability references."
    note: >-
      Canonical scheme is the semantic one (`C-TODAY`, `P-APPROVALS`, ...),
      because it is what code already consumes, it is stable under
      insertion, and the positional scheme had already broken down --
      `11-parent-rewards.md` carried two ids for one screen. All 17
      positional ids are mapped in `RETIRED_SCREEN_IDS`
      (packages/ux-contracts/src/screen-id-registry.ts) so old references
      still resolve; the namespace is completed by
      `SPECIFIED_SCREEN_IDS` for the eight screens that have a canonical
      name but no template-conformant contract yet. The nine early
      sketches that duplicate a contract were kept as product source but
      no longer declare an id. Enforced by tests, not by convention. See
      docs/ux/screen-id-scheme.md.
  - id: BLK-P1-002
    priority: P0
    status: PARTIALLY_RESOLVED
    title: "Complete Phase 1 contract and operation/API traceability freeze"
    owners: [uiux-lead, chief-architect, backend-lead]
    reviewers: [qa-lead, documentation-agent]
    blocks: [P1-001, P1-002A, P1-002B, P1-003, P1-004, P1-010, P1-016]
    resolution: "Freeze canonical operation IDs, state transitions, API mappings and error/recovery semantics before runtime implementation."
    note: >-
      P1-009 (screen map, action catalog, task/reward UI-state mappings) and
      P1-014 (5 real OpenAPI operations for the vertical slice: getChildToday,
      startTaskAssignment, approveTaskCompletion, rejectTaskCompletion,
      redeemReward, all with real operationIds in packages/ux-contracts's
      action catalog) close this for the vertical-slice scope. Family
      (P1-001), the Task DSL/Rules operations beyond the vertical slice
      (P1-002A/P1-002B), and Media (P1-005) operations are not frozen yet --
      this blocker stays open, narrowed to that remaining scope. Removed
      P1-014 from `blocks` since it is DONE.
  - id: BLK-P1-003
    priority: P0
    status: RESOLVED
    title: "Define contract-vs-implementation dependency semantics"
    owners: [ai-cto, chief-architect]
    reviewers: [documentation-agent, qa-lead]
    blocks: []
    resolution: "Allow downstream contract work after a dependency is FROZEN; require implementation DONE for integration and release. Encode both dependency classes in task metadata and validation."
    note: >-
      Encoded, not just documented. `deps_contract`/`deps_implementation`
      are real fields on the task schema; `claim`/`next` gate on contract
      dependencies, `handoff` (IN_PROGRESS -> REVIEW) gates on
      implementation dependencies, and `readyAdmissionProblems()` refuses
      a READY task that still carries unclassified `deps`. All 64
      registry tasks migrated from the participant matrix (registry
      version 9) by union, so no dependency edge was dropped in the
      process. See change-log 0.12 for the two deviations that needed a
      judgement call.
  - id: BLK-P1-004
    priority: P0
    status: RESOLVED
    title: "Every Phase 1 task must have independent reviewer and gate owners"
    owners: [ai-cto]
    reviewers: [chief-architect, qa-lead]
    blocks: []
    resolution: "Populate primary/reviewer/gate_owners, acceptance criteria and test strategy before status READY."
    note: >-
      `readyAdmissionProblems()` (tools/task-registry/src/schema.ts) enforces
      this structurally now, wired into `validateStructure()` and run by
      `task-registry validate`. Checked, not just documented: reviewer ==
      primary is explicitly rejected, and all five metadata fields are
      required for any task at READY.
  - id: BLK-P1-005
    priority: P0
    status: RESOLVED
    title: "Split Task/Rules epic into reviewable implementation units"
    owners: [backend-lead, chief-architect]
    reviewers: [qa-lead, security-child-safety]
    blocks: []
    resolution: "Replace one oversized P1-002 implementation stream with Task lifecycle, scheduling/Rules DSL and completion/attempt boundaries."
    note: >-
      Status was left OPEN when the split actually landed. Verified against
      the registry: `P1-002` is retired, `P1-002A` (task template and
      lifecycle core) and `P1-002B` (Rules DSL, scheduling, composite
      model) exist with full admission metadata and `discovered_from:
      P1-002`, and every dependent was redirected -- P1-003, P1-004 and
      P1-008 now depend on `P1-002B`, not on the retired epic. The third
      unit named in the resolution, completion/attempt boundaries, is
      `P1-008` (completion/verification/reward idempotency), which already
      existed as its own reviewable task rather than being carved out
      again.
  - id: BLK-P1-006
    priority: P0
    status: OPEN
    title: "Start real Phase 1 runtime implementation"
    owners: [backend-lead]
    reviewers: [chief-architect]
    gates: [qa-lead, security-engineering, child-safety-lead]
    blocks: [P1-007, P1-010, P1-016, P1-017, P1-018]
    resolution: "Implement Family, Task, persistence, verification, reward and application-service runtime instead of placeholder entrypoints."
  - id: BLK-P1-007

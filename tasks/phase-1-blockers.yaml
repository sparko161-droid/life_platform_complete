    title: "Implement transactional persistence and real API path"
    owners: [backend-lead, devops-lead]
    reviewers: [chief-architect, security-engineering]
    blocks: [P1-014, P1-015, P1-016, P1-017]
    resolution: "Add migrations, repositories/application services, API handlers, authorization and transaction boundaries for the vertical slice."
  - id: BLK-P1-008
    priority: P0
    status: OPEN
    title: "Prove exactly-once completion, verification and reward behavior"
    owners: [backend-lead, game-engine-lead]
    reviewers: [qa-lead, chief-architect]
    gates: [security-engineering, security-red-team]
    blocks: [P1-015, P1-016, P1-017, P1-007]
    resolution: "Create retry/race/conflict fixtures and enforce unique source reward identity plus deterministic state transitions."
  - id: BLK-P1-009
    priority: P0
    status: OPEN
    title: "Implement the first true family vertical slice"
    owners: [backend-lead, frontend-lead]
    reviewers: [chief-architect, qa-lead]
    gates: [security-engineering, child-safety-lead, security-red-team, journey-agent, documentation-agent]
    blocks: [P1-007, P1-017, P1-018]
    resolution: "Parent creates task -> child receives -> child completes -> proof -> parent approval -> reward ledger -> audit, with no manual DB intervention."
  - id: BLK-P1-010
    priority: P0
    status: OPEN
    title: "Phase 1 exit evidence gate"
    owners: [qa-lead, ai-cto]
    reviewers: [chief-architect, architecture-control-lead]
    gates: [security-engineering, child-safety-lead, security-red-team, performance-scale-agent, documentation-agent, journey-agent]
    blocks: [P2-001, P2-002, P2-003, P2-005, P5-005, P5-006]
    resolution: "Do not mark Phase 1 DONE until QA, security, child safety, adversarial security, scale, architecture control, journey and documentation evidence all pass."
  - id: BLK-P1-011
    priority: P0
    status: RESOLVED
    title: "Establish Architecture Control Plane and wave-level review artifacts"
    owners: [architecture-control-lead, chief-architect]
    reviewers: [ai-cto, documentation-agent]
    gates: [qa-lead]
    blocks: [phase-1-exit]
    resolution: "Create independent Wave Gates, Phase Architecture Control Gate and versioned review artifacts that compare code/contracts/events/database/tests/docs as one system."
    note: >-
      The artifacts are files with a schema, not a convention:
      `tasks/reviews/W<N>.yaml`, validated by `pnpm run control:validate`
      (wired into CI). A wave that claims an exit must have an artifact
      that decided PASS; an artifact that claims PASS cannot be
      contradicted by task status or by a blocker that is still OPEN;
      every evidence area from the template must be accounted for.
      Fixtures with deliberate drift and missing evidence assert the
      validator actually fails. `blocks` narrowed from W0-W8 to
      phase-1-exit: the mechanism now exists, so it no longer blocks the
      waves -- it gates them.
  - id: BLK-P1-012
    priority: P0
    status: PARTIALLY_RESOLVED
    title: "Establish versioning/evolution compatibility foundation"
    owners: [architecture-control-lead, backend-lead, devops-lead]
    reviewers: [chief-architect, qa-lead]
    gates: [documentation-agent, performance-scale-agent]
    blocks: [W5, phase-1-exit]
    resolution: "Implement and validate API/domain/event versioning, persisted artifact schema versions, migration compatibility, deprecation policy and controlled rollout rules."
    note: >-
      P1-019 (@life/versioning) implements semver compatibility checks
      (exercised against the real CONTRACT_VERSION), a generic zod
      schema-compatibility checker (regression-tested against
      Family/TaskAssignment/Reward schemas), a per-surface breaking/
      non-breaking rule catalog covering all 6 documented versioned
      surfaces, a structurally-validated deprecation-notice schema, and a
      pure feature-flag/controlled-rollout evaluator. Not resolved:
      persisted artifact schema versions (recorded as DISC-P1-019-1,
      deferred to when the persistence layer -- BLK-P1-007 -- lands and
      the real storage shape is known) and the documentation-agent/
      performance-scale-agent review gates (not yet run). Stays open,
      narrowed to that remaining scope, and still blocks W5/phase-1-exit
      until it closes.

historical_discoveries:
  - id: DISC-P1-009-2
    status: RESOLVED
    note: "domain-types package export metadata was discovered as a blocking import defect during P1-009. Fixed (package.json main/types/exports added); a second, related defect was then found and fixed while reconciling this branch: CI ran typecheck/test before build, so the fix's dist-based exports still weren't resolvable on a clean CI runner (passed locally only because a stale dist/ masked it) -- .github/workflows/ci.yml now builds first. Verified on a real GitHub Actions run, not just locally."
  - id: DISC-P1-014-1
    status: RESOLVED
    note: "packages/domain-types's DOMAIN_EVENT_TYPES was missing two of task-to-reward.md's seven Required events (PROGRESS_UPDATED, NOTIFICATION_REQUESTED), found while wiring P1-014's event path. Added both plus a completeness test."

  - id: P1-010
    phase: 1
    title: Parent/child core navigation and API wiring
    primary: frontend-lead
    status: DONE
    deps: []
    deps_contract:
      - P1-013
    deps_implementation:
      - P1-001
      - P1-002A
      - P1-002B
      - P1-009
    reviewer: backend-lead
    gate_owners:
      - qa-lead
      - security-engineering
      - child-safety-lead
    discovery_links:
      - discovery_id: DISC-P1-010-1
        source_task: P1-010
        type: MISSING_REQUIREMENT
        finding: 'RESCOPED after investigation -- the gap is larger than first recorded. The original finding was "no login operation in openapi.yaml". The real finding is that **the Identity domain has no contract at all**: packages/domain-types has no Account, User, Credential or Session entity, and neither ParentMembership nor ChildProfile carries any credential field. `docs/architecture/domain-map.md` lists Identity as a domain and says "Identity/Family -> nearly all domains", but P0-009''s contract pack froze Family/Task/Verification/Media/Reward and never covered it. `packages/domain-types/src/family-service.ts` states the assumption out loud -- "createFamily: any authenticated parent" -- without anything defining what an authenticated parent is. So `ParentId` is a branded UUID that, today, originates nowhere.'
        why_it_matters: 'This is not a missing endpoint that can be added to unblock a screen; it is a missing frozen domain that the whole authorization layer already depends on. Concretely: (1) every authenticated screen in P1-003/P1-004/P1-016 is unreachable by a real human -- the httpOnly cookie has nothing to put in it, and the vertical slice, though proven end to end in tests, cannot be demonstrated in a browser; (2) P1-025''s authorization checks resolve an actorId against parent_memberships, but nothing establishes that the caller *is* that actor except a token only tests mint; (3) adding an Account entity is a new frozen contract, which per contracts/registry.yaml''s own versioning policy is a contract-pack change, not an implementation detail.'
        affected_domains: []
        architecture_impact: 'Introduces the Identity domain to the contract pack for the first time -- a new frozen entity plus its relationship to ParentMembership/ChildProfile, and a decision about whether identity is owned in-house or delegated to a provider (MASTER_SPEC''s Phase 5 already anticipates Alice/Telegram/MAX integrations, any of which could be an identity provider rather than only a task surface).'
        security_impact: 'docs/adr/README.md lists "major security/privacy decision" as a mandatory ADR trigger, and docs/security/threat-model.md names account takeover and child impersonation as top threats. Credential storage, session lifetime, rotation and revocation (family-lifecycle.md already promises "Revocation immediately invalidates protected access tokens/session grants" -- which nothing currently implements) all get decided here.'
        ux_impact: 'No sign-in screen exists in packages/ux-contracts'' SCREEN_IDS. P-FAMILY-SETUP is named in SPECIFIED_SCREEN_IDS but has no frozen contract, so the entry point to the whole product is unspecified.'
        recommended_solution: 'Treat this as its own designed piece of work with a Human Architect decision and an ADR, not a task appended to the frontend stream: freeze an Identity contract (account, credential handling, session lifecycle, revocation), decide in-house vs delegated identity, then implement issuance endpoints + the httpOnly-cookie route handler (@life/web-session already provides sessionCookieOptions) and the sign-in screen contracts. Child access is a distinct sub-decision, and the frozen contracts already constrain it: ChildProfile has no credential fields, so child access must be parent-provisioned (device pairing or a parent-issued code) unless the contract itself changes.'
        alternatives:
          - 'Have the frontend mint its own tokens with the shared secret -- rejected outright: it would put the signing secret in the web tier and let any browser forge any actor, defeating the entire P1-025 authorization layer.'
          - 'Add a minimal stub login now to unblock P1-016 -- rejected as the default: a stub is the shape everything downstream would then assume, and this is precisely the "major security/privacy decision" the ADR rules exist for. Recorded as an option for the Human Architect rather than taken unilaterally.'
        priority: HIGH
        blocking: false
        proposed_task: null
    blocked_reason: null
    human_decisions: []
    origin_discovery: null
    discovered_from: null
    execution:
      wave: W6
      priority: P1
      acceptance_criteria: Core screens call real API operations and preserve auth, state and recovery semantics.
      test_strategy: Client/API integration and negative authorization tests.
      source_reference: tasks/phase-1-participant-matrix.yaml

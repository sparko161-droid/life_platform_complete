    discovery_links:
      - discovery_id: DISC-P1-019-1
        source_task: P1-019
        type: MISSING_REQUIREMENT
        finding: Persisted aggregates (Family/TaskTemplate/TaskAssignment/Reward) carry only an optimistic-concurrency `version` counter (packages/domain-types), not a schema-shape/migration version -- docs/architecture/versioning-and-compatibility.md's "Persisted task/rule/reward artifacts when their interpretation can change" surface has no version field to migrate against yet.
        why_it_matters: Rule 2 ("Existing persisted authoritative data must remain interpretable through a documented version/migration path") cannot be satisfied for a field that does not exist. Retrofitting a schemaVersion field touches every construction site across family-service.ts/task-service.ts/reward-service.ts and has no persistence layer to serialize/migrate against yet (BLK-P1-007 is open) -- adding it speculatively now, before the shape it needs to protect against is even known, risks guessing wrong and needing to change it again.
        affected_domains: []
        architecture_impact: null
        security_impact: null
        ux_impact: null
        recommended_solution: Add a `schemaVersion` field to each persisted aggregate schema when the persistence layer (BLK-P1-007) lands, informed by whatever the real storage shape turns out to need.
        alternatives: []
        priority: MEDIUM
        blocking: false
        proposed_task: null

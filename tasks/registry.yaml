        question: 'What is the minimum age for a child profile, and what parental consent is required to create one? ChildProfileSchema currently accepts birthYear 2000-2030 with no consent gate at all.'
        decision: >-
          Target age range is 4 to 12 years inclusive (Human Architect). Two consequences are engineering work, not prose: (1) ChildProfileSchema's birthYear range of 2000-2030 contradicts it -- at a 2026 reference date the supported range is about 2014-2022, and 2030 is a future year no living child can be born in. Narrowing a frozen contract is a breaking change, so it is recorded here for P1-034 to schedule rather than applied unilaterally. (2) A floor of 4 puts every child user under the 152-FZ minors provisions with no exception, so parental consent is required for every child profile with no per-age branch -- simpler to enforce, and worth stating now rather than discovering later. The consent content itself remains an open legal question.

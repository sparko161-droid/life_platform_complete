  - id: P1-021
    phase: 1
    title: Independent Security Red Team capability and Phase 1 assessment
    primary: security-red-team
    status: DONE
    deps: []
    deps_contract:
      - P0-008
      - P0-009
    deps_implementation:
      - P1-001
      - P1-005
      - P1-008

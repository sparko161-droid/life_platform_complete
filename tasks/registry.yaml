    discovery_links:
      - discovery_id: DISC-P1-028-1
        source_task: P1-028
        type: ARCHITECTURE_GAP
        finding: '`task-registry create-child-task` creates a task at BACKLOG, but the CLI has no command to move BACKLOG -> ANALYSIS -> ARCHITECTURE_CHECK (only `admit`, which targets READY and rejects a BACKLOG source). A discovery-created task therefore cannot reach READY through the CLI at all -- the same class of defect DISC-P0-003-1 recorded for claim/handoff.'
        why_it_matters: docs/governance/task-admission.md requires discovery-driven work to be traced through the registry, and AGENTS.md requires status changes to go through the locked/validated CLI rather than hand edits. Today those two rules contradict each other for every task create-child-task produces, forcing exactly the manual registry.yaml edit the CLI exists to prevent.
        affected_domains: []
        architecture_impact: null
        security_impact: null
        ux_impact: null
        recommended_solution: Add an `analyze <id>` (BACKLOG -> ANALYSIS) and `architecture-check <id>` (ANALYSIS -> ARCHITECTURE_CHECK) command pair, or widen `admit` to walk the whole BACKLOG -> READY path when the admission metadata is complete.
        alternatives:
          - 'Make create-child-task emit PLANNED instead of BACKLOG (PLANNED -> READY is already allowed) -- rejected: it would skip the analysis/architecture-check states that exist precisely because discovery-driven work has not been planned in advance.'
        priority: MEDIUM
        blocking: false
        proposed_task: null
    blocked_reason: null
    human_decisions: []
    origin_discovery: DISC-P1-026-1
    discovered_from: P1-026
    execution:
      wave: W7
      priority: P0
      acceptance_criteria: services/api/openapi/openapi.yaml carries a publishTaskTemplate operation (DRAFT -> ACTIVE), packages/api-client's generated types are regenerated and committed in the same change, and a matching TaskController handler exists so the full parent-creates-task -> assign -> child-completes -> approve -> reward chain is reachable through the real HTTP surface. Additive-only -- no existing operation or schema changes shape.
      test_strategy: e2e test extending services/api/test/http.e2e.test.ts to publish then assign through HTTP (the step DISC-P1-026-1 blocked), plus the existing generate:check CI gate proving the client was regenerated.
      source_reference: discovery:DISC-P1-026-1

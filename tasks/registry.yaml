    discovery_links:
      - discovery_id: DISC-P1-026-1
        source_task: P1-026
        type: MISSING_REQUIREMENT
        finding: 'services/api/openapi/openapi.yaml has no operation to publish a TaskTemplate (DRAFT -> ACTIVE) -- only createTaskTemplate (which returns a DRAFT) exists. assignTask requires an ACTIVE template (task-service.ts: ASSIGN_TASK_TEMPLATE_NOT_ACTIVE), so the frozen HTTP contract cannot reach past template creation: a client can never assign, start, submit, approve or redeem anything through the API as specified today.'
        why_it_matters: This blocks P1-027's E2E vertical slice (parent creates task -> child completes -> approval -> reward) from running end to end through the real HTTP surface -- the exact acceptance criterion P1-027 exists to prove. Found while writing P1-026's e2e test, which could only exercise createTaskTemplate and had to stop there rather than silently skip verifying the rest of the chain.
        affected_domains: []
        architecture_impact: null
        security_impact: null
        ux_impact: null
        recommended_solution: Add a publishTaskTemplate operation (e.g. POST /task-templates/{taskTemplateId}/publish) to openapi.yaml and a matching TaskController handler, following the same pattern as startTaskAssignment/approveTaskCompletion.
        alternatives:
          - 'Auto-publish on createTaskTemplate (skip DRAFT entirely via the API) -- rejected: DRAFT exists so a parent can build a template before children see it (docs/architecture/entity-lifecycle.md), auto-publishing would silently remove that.'
        priority: HIGH
        blocking: false
        proposed_task: null
    blocked_reason: null
    human_decisions: []
    origin_discovery: null
    discovered_from: null
    execution:
      wave: W7
      priority: P0
      acceptance_criteria: Every operation in services/api/openapi/openapi.yaml has a real NestJS handler wired to the P1-025 repository layer; a request's actor is derived from a verified session token, never a client-supplied field; idempotency keys are enforced on every mutating endpoint per docs/architecture/api-contracts.md.
